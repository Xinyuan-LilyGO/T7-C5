; PlatformIO project for the T7-C5 (ESP32-C5-MINI, 4 MB Flash, no PSRAM).
; Each environment points at one sketch under Arduino/examples.

[platformio]
; default_envs = battery_voltage
; default_envs = deep_sleep_timer
default_envs = factory
; default_envs = i2c_test
; default_envs = light_sleep_timer
; default_envs = scan
; default_envs = wifi_access_point
; default_envs = wifi_bluetooth_switch    

src_dir = src
lib_dir = Arduino/lib/libraries

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
extra_scripts = pre:scripts/select_example.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Match the Arduino IDE board settings documented for T7-C5.
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_no_ota_2mb.csv
board_upload.flash_size = 4MB
upload_speed = 921600

; Hardware CDC is enabled on boot; DFU is not used by this board.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=0

[env:battery_voltage]

[env:deep_sleep_timer]

[env:factory]

[env:i2c_test]

[env:light_sleep_timer]

[env:scan]

[env:wifi_access_point]

[env:wifi_bluetooth_switch]
